# NIX+ Update Package
# Provides NIX labs managed OTA updates for modules running factory firmware

globals:
  - id: ota_check_done
    type: bool
    restore_value: false
    initial_value: "false"

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(firmware_update)->add_on_state_callback([]() { id(ota_check_done) = true; });
    - priority: 100
      then:
        - wait_until:
            condition:
              wifi.connected:
        - update.check: firmware_update

ota:
  - platform: http_request # Allow pulling updates from the internet

# Update Check for NIX labs compiled firmware
update:
  - platform: http_request
    id: firmware_update
    name: Firmware Update
    source: https://assets.nixlabs.com.au/nix_plus/firmware/manifest.json
    web_server:
      sorting_group_id: sorting_system
      sorting_weight: 2

button:
  # Consolidated Update Management
  - platform: template
    name: "Update Firmware"
    id: update_firmware_button
    web_server:
      sorting_group_id: sorting_system
      sorting_weight: 3
    on_press:
      then:
        - if:
            condition:
              wifi.connected:
            then:
              - logger.log: "Initiating firmware update check..."
              - lambda: |-
                  id(ota_check_done) = false;
                  id(firmware_update)->status_clear_error();
              - update.check: firmware_update
              - wait_until:
                  condition:
                    lambda: "return id(ota_check_done) || id(firmware_update)->status_has_error();"
                  timeout: 15s
              - if:
                  condition:
                    lambda: "return id(firmware_update)->status_has_error();"
                  then:
                    - logger.log:
                        level: ERROR
                        format: "Firmware update check failed. Please check internet connection."
                  else:
                    - if:
                        condition:
                          lambda: "return !id(ota_check_done);"
                        then:
                          - logger.log:
                              level: WARN
                              format: "Firmware update check timed out after 15s."
                        else:
                          - if:
                              condition:
                                update.is_available: firmware_update
                              then:
                                - logger.log: "New version found! Starting Over-The-Air (OTA) update..."
                                - update.perform: firmware_update
                              else:
                                - logger.log: "No update available. Your module is currently up to date."
            else:
              - logger.log:
                  level: WARN
                  format: "Cannot check for firmware updates while Wi-Fi is disconnected."

