# NIX+ Time Package
# Manages network time synchronization (SNTP), hardware RTCC sync with base clock,
# manual time setting, and automatic IP geolocation timezone detection.

esphome:
  on_boot:
    # Priority -100: Initialise time zone from substitution default if not set
    - priority: -100
      then:
        - lambda: |-
            if (id(time_zone_rule).state.empty()) {
              id(time_zone_rule).publish_state("${time_zone}");
              ESP_LOGI("main", "Initialized Time Zone to default: %s", id(time_zone_rule).state.c_str());
            }

    # Priority 100: Network-dependent tasks (auto-detect TZ on first boot, trigger first SNTP sync)
    - priority: 100
      then:
        - wait_until:
            condition:
              wifi.connected:
        - if:
            condition:
              lambda: "return id(sntp_switch).state;"
            then:
              - lambda: "id(sntp_time)->update();"
              - logger.log:
                  level: INFO
                  format: "Boot: WiFi connected — triggering SNTP sync."
        - if:
            condition:
              lambda: "return !id(timezone_configured);"
            then:
              - delay: 2s
              - button.press: detect_timezone

time:
  # Internet Time Sync (SNTP)
  - platform: sntp
    id: sntp_time
    timezone: ${time_zone}
    # Use fast, reliable NTP servers for quick initial sync after WiFi connects
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - time.cloudflare.com
    update_interval: 15min
    on_time_sync:
      then:
        - if:
            condition:
              lambda: "return id(sntp_switch).state;"
            then:
              - lambda: |-
                  id(nix_clock).sync_time_to_clock();
                  ESP_LOGW("main", "SNTP Synchronized — writing accurate time to clock RTCC.");

interval:
  # Periodic RTCC sync: keep base clock RTCC accurate during normal SNTP operation
  - interval: 15min
    then:
      - if:
          condition:
            lambda: "return id(sntp_switch).state && id(sntp_time)->now().is_valid();"
          then:
            - lambda: "id(nix_clock).sync_time_to_clock();"
            - logger.log:
                level: INFO
                format: "Periodic RTC sync: pushed internet time to base clock RTCC."

switch:
  # Master switch for internet time sync
  - platform: template
    name: "Enable SNTP Sync"
    id: sntp_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: sorting_time
      sorting_weight: 0
    on_turn_on:
      then:
        - lambda: "id(sntp_time)->update();"

text:
  # POSIX Timezone String
  - platform: template
    name: "Time Zone"
    id: time_zone_rule
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ${time_zone}
    web_server:
      sorting_group_id: sorting_time
      sorting_weight: 1
    set_action:
      then:
        - lambda: |-
            if (esphome::nix_plus::NixPlus::is_valid_posix_tz(x)) {
              id(timezone_configured) = true;
            }
    on_value:
      then:
        - lambda: |-
            id(nix_clock).set_timezone(x);
            ESP_LOGI("main", "Timezone updated to: %s", x.c_str());
        - lambda: |-
            // Only sync time to the PIC32 if SNTP has a valid lock.
            // restore_value fires on_value at boot before SNTP syncs — without
            // this guard, the ESP32's default epoch time overwrites the PIC32 RTC.
            auto now = id(sntp_time)->now();
            if (now.is_valid() && now.year >= 2020) {
              id(nix_clock).sync_time_to_clock();
            } else {
              ESP_LOGI("main", "Timezone restored at boot — skipping time sync (SNTP not yet valid)");
            }

button:
  # Detect Timezone via IP Geolocation
  - platform: template
    name: "Auto-Detect Time Zone"
    id: detect_timezone
    web_server:
      sorting_group_id: sorting_time
      sorting_weight: 2
    on_press:
      then:
        - logger.log: "Stage 1: Detecting IANA Timezone..."
        - http_request.get:
            url: "https://ipwho.is/?fields=success,timezone"
            request_headers:
              User-Agent: "ESPHome/NIXPlus"
            capture_response: true
            max_response_buffer_size: 512B
            on_response:
              then:
                - lambda: |-
                    if (response->status_code != 200 || body.empty()) {
                      ESP_LOGW("main", "Timezone Stage 1 (ipwho.is) failed (HTTP %d); trying fallback.", response->status_code);
                      App.scheduler.set_timeout(id(nix_clock), "tz_fallback", 0, []() { id(detect_timezone_fallback).press(); });
                      return;
                    }
                    bool ok = json::parse_json(body, [](JsonObject root) -> bool {
                      if (root["success"].is<bool>() && !root["success"].as<bool>()) {
                        return false;
                      }
                      JsonObject tz = root["timezone"];
                      if (tz["id"].is<const char*>()) {
                        std::string iana = tz["id"].as<std::string>();
                        if (!iana.empty()) {
                          id(detected_iana) = iana;
                          // Defer Stage 2 so Stage 1's TLS session & JSON heap are freed first
                          App.scheduler.set_timeout(id(nix_clock), "tz_stage2", 0, []() { id(fetch_posix_rule).press(); });
                          return true;
                        }
                      }
                      return false;
                    });
                    if (!ok) {
                      ESP_LOGW("main", "Timezone Stage 1 (ipwho.is) parse failed; trying fallback.");
                      App.scheduler.set_timeout(id(nix_clock), "tz_fallback", 0, []() { id(detect_timezone_fallback).press(); });
                    }
            on_error:
              then:
                - logger.log:
                    level: WARN
                    format: "Timezone Stage 1 (ipwho.is) request error; trying fallback."
                - lambda: |-
                    App.scheduler.set_timeout(id(nix_clock), "tz_fallback", 0, []() { id(detect_timezone_fallback).press(); });

  # Stage 1 Fallback: ip-api.com if ipwho.is fails or rate-limits
  - platform: template
    name: "Detect Timezone Fallback"
    id: detect_timezone_fallback
    internal: true
    on_press:
      then:
        - logger.log: "Stage 1 Fallback: Detecting IANA Timezone via ip-api.com..."
        - http_request.get:
            url: "http://ip-api.com/json/?fields=status,timezone"
            request_headers:
              User-Agent: "ESPHome/NIXPlus"
            capture_response: true
            max_response_buffer_size: 512B
            on_response:
              then:
                - lambda: |-
                    if (response->status_code != 200 || body.empty()) {
                      ESP_LOGE("main", "Timezone Stage 1 fallback failed (HTTP %d). Check internet connection.", response->status_code);
                      return;
                    }
                    bool ok = json::parse_json(body, [](JsonObject root) -> bool {
                      if (!root["status"].is<const char*>() || root["status"].as<std::string>() != "success") {
                        return false;
                      }
                      if (root["timezone"].is<const char*>()) {
                        std::string iana = root["timezone"].as<std::string>();
                        if (!iana.empty()) {
                          id(detected_iana) = iana;
                          App.scheduler.set_timeout(id(nix_clock), "tz_stage2", 0, []() { id(fetch_posix_rule).press(); });
                          return true;
                        }
                      }
                      return false;
                    });
                    if (!ok) {
                      ESP_LOGE("main", "Timezone Stage 1 fallback returned invalid response.");
                    }
            on_error:
              then:
                - logger.log:
                    level: ERROR
                    format: "Timezone Stage 1 fallback failed. Check internet connection."

  # Stage 2: Lookup POSIX Rule from our static database
  - platform: template
    name: "Fetch POSIX Rule"
    id: fetch_posix_rule
    internal: true
    on_press:
      then:
        - logger.log: "Stage 2: Looking up POSIX rule for city..."
        - http_request.get:
            url: !lambda |-
              std::string iana = id(detected_iana);
              size_t pos = iana.find('/');
              std::string continent = (pos != std::string::npos) ? iana.substr(0, pos) : "Etc";
              return "https://assets.nixlabs.com.au/nix_plus/static/" + continent + ".json";
            request_headers:
              User-Agent: "ESPHome/NIXPlus"
            capture_response: true
            max_response_buffer_size: 8kB
            on_response:
              then:
                - lambda: |-
                    if (response->status_code != 200 || body.empty()) {
                      ESP_LOGE("main", "Timezone Stage 2 failed (HTTP %d). Keeping existing timezone.", response->status_code);
                      return;
                    }
                    bool found = false;
                    std::string iana = id(detected_iana);
                    json::parse_json(body, [&found, iana](JsonObject root) -> bool {
                      size_t pos = iana.find('/');
                      std::string city = (pos != std::string::npos && pos + 1 < iana.size()) ? iana.substr(pos + 1) : iana;
                      if (!city.empty() && root[city].is<const char*>()) {
                        std::string posix = root[city].as<std::string>();
                        auto call = id(time_zone_rule).make_call();
                        call.set_value(posix);
                        call.perform();
                        ESP_LOGI("main", "Success! Applied POSIX rule for %s: %s", iana.c_str(), posix.c_str());
                        found = true;
                        return true;
                      }
                      return false;
                    });
                    if (!found) {
                      ESP_LOGW("main", "City '%s' not found in POSIX DB. Keeping existing timezone.", iana.c_str());
                    }
            on_error:
              then:
                - logger.log:
                    level: ERROR
                    format: "Timezone Stage 2 request failed. Keeping existing timezone."

  - platform: template
    name: "Force RTC Sync Now"
    web_server:
      sorting_group_id: sorting_time
      sorting_weight: 3
    on_press:
      - lambda: |-
          id(nix_clock).sync_time_to_clock();

